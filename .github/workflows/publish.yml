name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # Required for trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test release checks
        run: node --test scripts/prepare-release.test.mjs

      - name: Check types, lint, and package contents
        run: |
          pnpm check
          pnpm lint
          pnpm format:check
          pnpm package:check

      - name: Check release versions
        id: release
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME"

      - name: Publish cliplink-schema
        if: steps.release.outputs.schema_publish == 'true'
        run: npm publish
        working-directory: packages/clip-schema

      - name: Publish cliplink
        if: steps.release.outputs.cli_publish == 'true'
        run: npm publish
        working-directory: packages/clip-cli
