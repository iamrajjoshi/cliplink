name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm check

      - name: Lint the CLI
        run: pnpm lint

      - name: Lint the landing page
        run: pnpm exec eslint site/*.js

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Check the landing page and release scripts
        run: pnpm site:check

      - name: Build the landing page
        run: pnpm site:build

      - name: Check published package contents and licenses
        run: pnpm package:check
